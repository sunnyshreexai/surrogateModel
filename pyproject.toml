[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surrogatemodel"
version = "1.0.0"
description = "ML Model Construction Using Combinatorial Testing and Active Learning"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Sunny Shree", email = "sunny.shree@mavs.uta.edu"},
    {name = "Krishna Khadka"},
    {name = "Yu Lei"}
]
maintainers = [
    {name = "Sunny Shree", email = "sunny.shree@mavs.uta.edu"}
]
keywords = [
    "machine learning",
    "surrogate model",
    "combinatorial testing",
    "active learning",
    "model extraction",
    "counterfactual explanations",
    "black-box models"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "isort>=5.10.0",
]
visualization = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]
optimization = [
    "optuna>=3.0.0",
]
deep = [
    "torch>=1.10.0",
    "tensorflow>=2.8.0",
]
all = [
    "surrogatemodel[dev,visualization,optimization,deep]",
]

[project.urls]
Homepage = "https://github.com/sunnyshreexai/surrogateModel"
Documentation = "https://github.com/sunnyshreexai/surrogateModel/wiki"
Repository = "https://github.com/sunnyshreexai/surrogateModel.git"
"Bug Tracker" = "https://github.com/sunnyshreexai/surrogateModel/issues"

[project.scripts]
surrogatemodel = "surrogatemodel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["surrogatemodel*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=surrogatemodel",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["surrogatemodel"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/cli.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
    "if TYPE_CHECKING:",
]